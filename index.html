<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SUPERVECTAR VLC</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 20px;
      max-width: 1000px;
      margin: auto;
      background: #0b0b0b;
      color: #eee;
    }

    h1 {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
      margin-bottom: 20px;
      color: #FFD700;
      flex-wrap: wrap;
      font-size: clamp(1.4rem, 2.5vw, 1.8rem);
    }

    h1 .main-logo { height: 1em; width: auto; }
    h2 { font-size: 1.3rem; margin-top: 2rem; margin-bottom: 0.8rem; color: #FFD700; }

    .search-box { text-align: center; margin-bottom: 20px; }
    .search-box input {
      width: 90%; max-width: 500px; padding: 10px;
      border-radius: 8px; border: none; outline: none;
      background: #222; color: #eee; font-size: 1rem;
    }

    .category-grid { display: flex; flex-direction: column; gap: 10px; }

    .card {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 10px;
      transition: transform 0.2s;
    }
    .card:hover { transform: scale(1.02); }

    .card img {
      width: 60px;
      height: 60px;
      object-fit: contain;
      margin-right: 10px;
      background: #fff;
      padding: 5px;
      border-radius: 5px;
    }

    .card strong { color: #FFD700; flex: 1; font-size: 1rem; }

    .actions { display: flex; gap: 5px; flex-wrap: wrap; }
    .actions button {
      padding: 5px 8px; border: none; border-radius: 6px;
      cursor: pointer; font-size: 0.8rem;
    }
    .btn-android { background: #4CAF50; color: #fff; }
    .btn-ios { background: #2196F3; color: #fff; }
    .btn-direct { background: #777; color: #fff; }
    .btn-copy { background: #FFD700; color: #000; }

    .no-results { text-align: center; color: #888; margin-top: 20px; }

    /* Estilo del toast */
    #toast {
      visibility: hidden;
      min-width: 180px;
      background-color: #333;
      color: #fff;
      text-align: center;
      border-radius: 10px;
      padding: 10px;
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      transition: opacity 0.3s ease, bottom 0.3s ease;
      opacity: 0;
    }

    #toast.show {
      visibility: visible;
      opacity: 1;
      bottom: 50px;
    }

    #notice a { color: #FFD700; text-decoration: underline; }
    #notice a:hover { color: #FFA500; }
  </style>
</head>
<body>
  <h1>
    <img src="https://i.ibb.co/FnGwW1c/Logo.png" alt="Logo" class="main-logo">
    SUPERVECTAR VLC
  </h1>

  <div id="notice">
    ⚠️ Para reproducir los canales es necesario tener instalado el reproductor VLC:
    <a href="https://play.google.com/store/apps/details?id=org.videolan.vlc&hl=es" target="_blank">Descargar VLC Android</a>.
    <a href="https://apps.apple.com/es/app/vlc-media-player/id650377962" target="_blank">Descargar VLC IOS</a>.
    <a href="https://images.videolan.org/vlc/download-windows.html" target="_blank">Descargar VLC Windows</a>.	
  </div>

  <div class="search-box">
    <input type="text" id="search" placeholder="🔍 Buscar canal..." />
  </div>

  <div id="container"></div>
  <div class="no-results" style="display:none;">No se encontraron canales 😕</div>

  <!-- Toast de notificación -->
  <div id="toast"></div>

  <script>

          { nombre: "Movistar+ Plus FHD (NEW ERA VI)", url: "http://vlc.shickat.me:8000/pid/5866e83279307bf919068ae7a0d250e4e424e464/stream.mp4", logo: "https://upload.wikimedia.org/wikipedia/commons/1/1d/Movistar_Plus%2B_2022_logo.svg" },		
          { nombre: "M+ Originales", url: "http://vlc.shickat.me:8000/pid/096b817fcc836535f608facb15fca6408fae3162/stream.mp4", logo: "https://upload.wikimedia.org/wikipedia/commons/b/bd/Originales_por_Movistar_Plus%2B_2023_Logo.svg" },		  
          { nombre: "M+ Estrenos", url: "http://vlc.shickat.me:8000/pid/5d35f906b735f25164fa2b9b7a4e6ef91dfed131/stream.mp4", logo: "https://upload.wikimedia.org/wikipedia/commons/5/59/Estrenos_por_Movistar_Plus%2B_2025_Logo.svg" },
          { nombre: "M+ Hits", url: "http://vlc.shickat.me:8000/pid/50553edb5e8c54d15e0d43161369b3b4cef95065/stream.mp4", logo: "https://upload.wikimedia.org/wikipedia/commons/2/29/Hits_por_Movistar_Plus%2B_2025_Logo.svg" },		  
          { nombre: "M+ Acción", url: "http://vlc.shickat.me:8000/pid/089673779de9fa7a18ac8dc26eb4a79cf5a86f96/stream.mp4", logo: "https://upload.wikimedia.org/wikipedia/commons/e/ea/Acci%C3%B3n_por_Movistar_Plus%2B_2023_Logo.svg" },
          { nombre: "M+ Acción", url: "http://vlc.shickat.me:8000/pid/102bcb79ca391e37ac1fc9ee77dc53440d0a59ce/stream.mp4", logo: "https://upload.wikimedia.org/wikipedia/commons/e/ea/Acci%C3%B3n_por_Movistar_Plus%2B_2023_Logo.svg" },		  
          { nombre: "M+ Comedia", url: "http://vlc.shickat.me:8000/pid/cf0cb321eed6765c2eadbd9983570f6674ce5df6/stream.mp4", logo: "https://upload.wikimedia.org/wikipedia/commons/6/69/Comedia_por_Movistar_Plus%2B_2023_Logo.svg" },		  
          { nombre: "M+ Drama", url: "http://vlc.shickat.me:8000/pid/a6de6a4977d7801bbddc9c7739d822f4beb358ae/stream.mp4", logo: "https://upload.wikimedia.org/wikipedia/commons/6/62/Drama_por_Movistar_Plus%2B_2023_Logo.svg" },		  
          { nombre: "M+ Cine Español", url: "http://vlc.shickat.me:8000/pid/e4bce95dd4faeb9cb09ade36a0636bc4b22b691c/stream.mp4", logo: "https://upload.wikimedia.org/wikipedia/commons/2/24/Cine_Espa%C3%B1ol_por_Movistar_Plus%2B_2023_Logo.svg" },
          { nombre: "M+ Clásicos", url: "http://vlc.shickat.me:8000/pid/6462c8f65fcaa6e4fc874fef8d1e45bb7a7e6bae/stream.mp4", logo: "https://upload.wikimedia.org/wikipedia/commons/d/dd/Cl%C3%A1sicos_por_Movistar_Plus%2B_2023_Logo.svg" },
          { nombre: "M+ Indie", url: "http://vlc.shickat.me:8000/pid/7716c9fd5bd4413715e4e26f97efb91802f6ee80/stream.mp4", logo: "https://upload.wikimedia.org/wikipedia/commons/6/61/Indie_por_Movistar_Plus%2B_2023_Logo.svg" },

          { nombre: "M+ Romance", url: "http://vlc.shickat.me:8000/pid/4bfeb0516c44c4f0e3502e3f1ca1035d39ddf9c2/stream.mp4", logo: "https://www.movistarplus.es/recorte/m-NEO/canal/MROMA.png" },
          { nombre: "Dark", url: "http://vlc.shickat.me:8000/pid/25465ea2deba65c623b7659136abf6fcc9f5dc20/stream.mp4", logo: "https://upload.wikimedia.org/wikipedia/commons/5/5f/Dark_Teuve_2.png" },
          { nombre: "Syfy", url: "http://vlc.shickat.me:8000/pid/8e1bbcb6a6b8b9bb0e1144454fda35531107cdb3/stream.mp4", logo: "https://upload.wikimedia.org/wikipedia/commons/b/be/SYFY.svg" },
          { nombre: "Amc", url: "http://vlc.shickat.me:8000/pid/55ff9ee631af351f365f51cf3601695bf1fd20f3/stream.mp4", logo: "https://upload.wikimedia.org/wikipedia/commons/3/34/AMC_logo_2019.svg" },
          { nombre: "Xtrm", url: "http://vlc.shickat.me:8000/pid/d7d3830018cfd93c7430c19ba703a053680476a0/stream.mp4", logo: "https://upload.wikimedia.org/wikipedia/commons/6/60/XTRM_Espa%C3%B1a.png" }		  
        ]
      },
      {
       nombre: "Documentales y mas",
        canales: [
          { nombre: "Movistar Documentales", url: "http://vlc.shickat.me:8000/pid/b3fc9b5647c5933b101c0b6b64322590c68587b9/stream.mp4", logo: "https://upload.wikimedia.org/wikipedia/commons/d/d2/Documentales_por_Movistar_Plus%2B_2023_Logo.svg" }	  
        ]
      },
      {	  
        nombre: "TDT España",
        canales: [
          { nombre: "Movistar Documentales", url: "http://vlc.shickat.me:8000/pid/b3fc9b5647c5933b101c0b6b64322590c68587b9/stream.mp4", logo: "https://upload.wikimedia.org/wikipedia/commons/d/d2/Documentales_por_Movistar_Plus%2B_2023_Logo.svg" }
        ]
      }
    ];


    function isAndroid() { return /Android/i.test(navigator.userAgent); }
    function isIOS() { return /iPhone|iPad|iPod/i.test(navigator.userAgent); }

    function openWithAndroidIntent(url) {
      const fallback = encodeURIComponent(url);
      const urlNoScheme = url.replace(/^https?:\/\//i, '');
      const intentUri = 'intent://' + urlNoScheme +
        '#Intent;scheme=http;package=org.videolan.vlc;S.browser_fallback_url=' + fallback + ';end';
      window.location.href = intentUri;
    }

    function openWithiOSVLC(url) {
      const uri = 'vlc-x-callback://x-callback-url/stream?url=' + encodeURIComponent(url);
      window.location.href = uri;
    }

    function openDirect(url) { window.open(url, '_blank', 'noopener'); }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text)
        .then(() => showToast("✅ Enlace copiado"))
        .catch(() => alert("No se pudo copiar el enlace 😕"));
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = "show";
      setTimeout(() => {
        toast.className = toast.className.replace("show", "");
      }, 2000);
    }

    const container = document.getElementById('container');

    categorias.forEach(cat => {
      const titulo = document.createElement('h2');
      titulo.textContent = cat.nombre;
      container.appendChild(titulo);

      const grid = document.createElement('div');
      grid.className = 'category-grid';
      container.appendChild(grid);

      cat.canales.forEach(ch => {
        const card = document.createElement('div');
        card.className = 'card';
        card.setAttribute('data-nombre', ch.nombre.toLowerCase());

        card.innerHTML = `
          <img src="${ch.logo}" alt="logo">
          <strong>${ch.nombre}</strong>
          <div class="actions">
            <button class="btn-android">📱 Android</button>
            <button class="btn-ios">🍎 iOS</button>
            <button class="btn-direct">🌐 Web</button>
            <button class="btn-copy">📋 Copiar enlace</button>
          </div>
        `;

        card.querySelector('.btn-android').addEventListener('click', () => {
          if (isAndroid()) openWithAndroidIntent(ch.url);
          else alert('Solo para Android');
        });
        card.querySelector('.btn-ios').addEventListener('click', () => {
          if (isIOS()) openWithiOSVLC(ch.url);
          else alert('Solo para iPhone/iPad');
        });
        card.querySelector('.btn-direct').addEventListener('click', () => openDirect(ch.url));
        card.querySelector('.btn-copy').addEventListener('click', () => copyToClipboard(ch.url));

        grid.appendChild(card);
      });
    });

    const searchInput = document.getElementById('search');
    const noResults = document.querySelector('.no-results');

    searchInput.addEventListener('input', () => {
      const query = searchInput.value.toLowerCase();
      const cards = document.querySelectorAll('.card');
      let visible = 0;

      cards.forEach(card => {
        const name = card.getAttribute('data-nombre');
        if (name.includes(query)) {
          card.style.display = 'flex';
          visible++;
        } else { card.style.display = 'none'; }
      });

      noResults.style.display = visible === 0 ? 'block' : 'none';
    });
  </script>
</body>
</html>
