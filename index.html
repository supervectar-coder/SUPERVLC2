    body {
      font-family: system-ui, sans-serif;
      padding: 20px;
      max-width: 1000px;
      margin: auto;
      background: #0b0b0b;
      color: #eee;
    }

    h1 {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
      margin-bottom: 20px;
      color: #FFD700;
      flex-wrap: wrap;
      font-size: clamp(1.4rem, 2.5vw, 1.8rem);
    }

    h1 .main-logo { height: 1em; width: auto; }
    h2 { font-size: 1.3rem; margin-top: 2rem; margin-bottom: 0.8rem; color: #FFD700; }

    .search-box { text-align: center; margin-bottom: 10px; }
    .search-box input {
      width: 90%; max-width: 500px; padding: 10px;
      border-radius: 8px; border: none; outline: none;
      background: #222; color: #eee; font-size: 1rem;
    }

    /* Botones de categorías */
    .category-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .category-buttons button {
      background: #222;
      color: #FFD700;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 8px 15px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: bold;
    }

    .category-buttons button:hover {
      background: #FFD700;
      color: #000;
    }

    .category-buttons button.active {
      background: #FFD700;
      color: #000;
      border-color: #FFD700;
    }

    .category-grid { display: flex; flex-direction: column; gap: 10px; }

    .card {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 10px;
      transition: transform 0.2s;
    }

    .card:hover {
      transform: scale(1.02);
      box-shadow: 0 0 10px #ffd70044;
    }

    .card img {
      width: 60px;
      height: 60px;
      object-fit: contain;
      margin-right: 10px;
      background: #fff;
      padding: 5px;
      border-radius: 5px;
    }

    .card strong { color: #FFD700; flex: 1; font-size: 1rem; }

    .actions { display: flex; gap: 5px; flex-wrap: wrap; }
    .actions button {
      padding: 5px 8px; border: none; border-radius: 6px;
      cursor: pointer; font-size: 0.8rem;
    }
    .btn-android { background: #4CAF50; color: #fff; }
    .btn-ios { background: #2196F3; color: #fff; }
    .btn-direct { background: #777; color: #fff; }
    .btn-copy { background: #FFD700; color: #000; }

    .no-results { text-align: center; color: #888; margin-top: 20px; }

    #toast {
      visibility: hidden;
      min-width: 180px;
      background-color: #333;
      color: #fff;
      text-align: center;
      border-radius: 10px;
      padding: 10px;
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      transition: opacity 0.3s ease, bottom 0.3s ease;
      opacity: 0;
    }

    #toast.show {
      visibility: visible;
      opacity: 1;
      bottom: 50px;
    }

    #notice a { color: #FFD700; text-decoration: underline; }
    #notice a:hover { color: #FFA500; }
  </style>

    function isAndroid() { return /Android/i.test(navigator.userAgent); }
    function isIOS() { return /iPhone|iPad|iPod/i.test(navigator.userAgent); }

    function openWithAndroidIntent(url) {
      const fallback = encodeURIComponent(url);
      const urlNoScheme = url.replace(/^https?:\/\//i, '');
      const intentUri = 'intent://' + urlNoScheme +
        '#Intent;scheme=http;package=org.videolan.vlc;S.browser_fallback_url=' + fallback + ';end';
      window.location.href = intentUri;
    }

    function openWithiOSVLC(url) {
      const uri = 'vlc-x-callback://x-callback-url/stream?url=' + encodeURIComponent(url);
      window.location.href = uri;
    }

    function openDirect(url) {
      window.open(url, '_blank', 'noopener,noreferrer');
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text)
        .then(() => showToast("✅ Enlace copiado"))
        .catch(() => alert("No se pudo copiar el enlace 😕"));
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = "show";
      setTimeout(() => {
        toast.className = toast.className.replace("show", "");
      }, 2000);
    }

    const container = document.getElementById('container');

    categorias.forEach(cat => {
      const titulo = document.createElement('h2');
      titulo.textContent = cat.nombre;
      container.appendChild(titulo);

      const grid = document.createElement('div');
      grid.className = 'category-grid';
      container.appendChild(grid);

      cat.canales.forEach(ch => {
        const card = document.createElement('div');
        card.className = 'card';
        card.setAttribute('data-nombre', ch.nombre.toLowerCase());

        card.innerHTML = `
          <img src="${ch.logo}" alt="logo de ${ch.nombre}">
          <strong>${ch.nombre}</strong>
          <div class="actions">
            <button class="btn-android">📱 Android</button>
            <button class="btn-ios">🍎 iOS</button>
            <button class="btn-direct">🌐 Web</button>
            <button class="btn-copy">📋 Copiar enlace</button>
          </div>
        `;

        card.querySelector('.btn-android').addEventListener('click', () => {
          if (isAndroid()) openWithAndroidIntent(ch.url);
          else alert('Solo para Android');
        });
        card.querySelector('.btn-ios').addEventListener('click', () => {
          if (isIOS()) openWithiOSVLC(ch.url);
          else alert('Solo para iPhone/iPad');
        });
        card.querySelector('.btn-direct').addEventListener('click', () => openDirect(ch.url));
        card.querySelector('.btn-copy').addEventListener('click', () => copyToClipboard(ch.url));

        grid.appendChild(card);
      });
    });

    // === BOTONES DE CATEGORÍAS ===
    const categoryButtonsContainer = document.getElementById('category-buttons');

    // Crear botones según las categorías existentes
    categorias.forEach((cat, index) => {
      const btn = document.createElement('button');
      btn.textContent = cat.nombre;
      btn.setAttribute('data-category', index);
      categoryButtonsContainer.appendChild(btn);
    });

    function filterByCategory(categoryIndex) {
      const allCategories = container.querySelectorAll('h2, .category-grid');
      let catCount = 0;
      allCategories.forEach((el) => {
        if (el.tagName === 'H2') {
          const grid = el.nextElementSibling;
          if (catCount === Number(categoryIndex)) {
            el.style.display = '';
            grid.style.display = '';
          } else {
            el.style.display = 'none';
            grid.style.display = 'none';
          }
          catCount++;
        }
      });
      document.querySelectorAll('.category-buttons button').forEach(b => b.classList.remove('active'));
      const activeButton = document.querySelector(`.category-buttons button[data-category="${categoryIndex}"]`);
      if (activeButton) activeButton.classList.add('active');
    }

    document.querySelectorAll('.category-buttons button').forEach(btn => {
      btn.addEventListener('click', () => {
        const index = btn.getAttribute('data-category');
        filterByCategory(index);
      });
    });

    const allButton = document.createElement('button');
    allButton.textContent = "📺 Todos";
    allButton.classList.add('active');
    categoryButtonsContainer.prepend(allButton);

    allButton.addEventListener('click', () => {
      document.querySelectorAll('h2, .category-grid').forEach(el => el.style.display = '');
      document.querySelectorAll('.category-buttons button').forEach(b => b.classList.remove('active'));
      allButton.classList.add('active');
    });

    // === BUSCADOR ===
    const searchInput = document.getElementById('search');
    const noResults = document.querySelector('.no-results');

    searchInput.addEventListener('input', () => {
      const query = searchInput.value.toLowerCase();
      const cards = document.querySelectorAll('.card');
      let visible = 0;

      cards.forEach(card => {
        const name = card.getAttribute('data-nombre');
        if (name.includes(query)) {
          card.style.display = 'flex';
          visible++;
        } else { card.style.display = 'none'; }
      });

      noResults.style.display = visible === 0 ? 'block' : 'none';
    });
